services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Kein Host-Port nötig: Das Frontend (nginx) proxied /api/ intern zu app:3000
    # über das appnet-Netzwerk. Ein Host-Mapping würde mit FRONTEND_PORT kollidieren,
    # wenn WEB_PORT == FRONTEND_PORT gesetzt ist.
    # ports:
    #   - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-knora}:${DB_PASSWORD:-changeme}@knora-db:5432/knora
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PARSER_URL: http://parser:8000/parse
      PORT: 3000
      # YouTube-Transkript-Provider (Apify/Supadata) – von Hetzner-IPs ist YouTube gesperrt,
      # daher muss der externe Provider aus der .env in den Container durchgereicht werden.
      YOUTUBE_TRANSCRIPT_PROVIDER: ${YOUTUBE_TRANSCRIPT_PROVIDER:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Große Uploads werden mehrfach in den RAM kopiert (parseBody → arrayBuffer → Blob).
    # Cap an den kleinen, geteilten Prod-Host (3,7 GB, ~15 weitere Apps) angepasst:
    # im Zweifel fällt nur dieser Container (kontrollierter OOM-Restart), nicht der Server.
    mem_limit: 768m
    networks:
      - appnet
      - hetzner-network

  # Wartungs-Container für die Skripte unter backend/src/scripts (Import,
  # Embedding-Backfill, Wiki-Läufe, Migrationen). Läuft durch das Profil "tools"
  # nie im Normalbetrieb mit und wird von `docker compose up -d` ignoriert.
  #
  # Der Grund für ein eigenes Image: das App-Image enthält nur das gebündelte
  # dist/index.js und keine node_modules – dort scheitert jedes Skript sofort.
  #
  # Beispiele (auf dem Host, im Repo-Verzeichnis):
  #   docker compose --profile tools build tools
  #   docker compose --profile tools run --rm tools \
  #     bun run src/scripts/verify-rki.ts --workspace "RKI Sitzungsprotokolle"
  #
  # Für lange Läufe abgekoppelt starten, damit ein Verbindungsabbruch nichts tut:
  #   docker compose --profile tools run -d --name rki-wiki tools \
  #     bun run src/scripts/rki-wiki-run.ts --workspace <id> --depth summary
  #   docker logs -f rki-wiki
  tools:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql://${DB_USER:-knora}:${DB_PASSWORD:-changeme}@knora-db:5432/knora
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PARSER_URL: http://parser:8000/parse
      YOUTUBE_TRANSCRIPT_PROVIDER: ${YOUTUBE_TRANSCRIPT_PROVIDER:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      # Bei Massenläufen zwingend: sonst startet jede Wiki-Generierung einen
      # workspace-weiten Embedding-Sweep und hunderte davon überlagern sich.
      WIKI_EMBED_AFTER_GENERATE: "0"
    volumes:
      # Zwischenstufe der RKI-Protokolle (Markdown + manifest.json), per rsync
      # auf den Host gelegt. Bewusst außerhalb des Repos, damit `git pull` beim
      # Deploy nicht darüber stolpert.
      - ${RKI_MD_DIR:-/root/rki-md}:/data:ro
    depends_on:
      db:
        condition: service_healthy
    # Wartungsläufe sind sequenziell und streamend; genügend Luft auf dem
    # kleinen Host, aber begrenzt, damit ein Fehllauf nicht den Server mitnimmt.
    mem_limit: 512m
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3084}:80"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - appnet
      - hetzner-network

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-knora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: knora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-knora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      appnet:
        aliases:
          - knora-db

  # Parser wird für PDF/DOCX/HTML-Import zwingend gebraucht und läuft daher immer mit
  # (kein Profil-Gate mehr – sonst startet ihn `docker compose up -d --build` beim
  # Deploy nicht und der Import bricht ab). PARSER_URL im app-Service zeigt auf parser:8000.
  parser:
    build: ./parser
    environment:
      PORT: 8000
    restart: unless-stopped
    # MarkItDown/pdfminer lädt das komplette PDF in den RAM. Cap an den kleinen,
    # geteilten Prod-Host angepasst (3,7 GB total). ACHTUNG: reicht für kleine/mittlere
    # PDFs, NICHT für tausende Seiten – solche Riesen-Docs sprengen diese Hardware
    # unabhängig vom Cap und müssten vorab in Teile gesplittet werden.
    mem_limit: 1g
    networks:
      - appnet

volumes:
  data:

networks:
  appnet:
  hetzner-network:
    external: true
